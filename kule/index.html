<title>FÖY Kule</title>
<!-- Ana ekran kısayolu. Kule claude.ai'de yaşar; iPhone onu Claude uygulamasında tam ekran ancak bir PARMAK
     DOKUNUŞUYLA açar (kendiliğinden yönlendirme Safari'de, claude.ai çerçevesiyle açılıyordu — Orçun, 13 Eki).
     Bu yüzden sayfa yönlendirmez: ekranın tamamı tek bir bağlantıdır, bir dokunuş kuleyi açar.
     "?ekle" ile açılınca ana ekrana ekleme notu görünür. Kulenin kendisi gizlidir, yalnız sahibi açabilir. -->
<link rel="apple-touch-icon" href="/kule/foy-kule-ikon-c.png" />
<link rel="icon" href="/assets/favicon.png" />
<link rel="manifest" href="/kule/manifest.webmanifest" />
<meta name="apple-mobile-web-app-title" content="FÖY Kule" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#060A16" />
<style>
  html,body{margin:0;height:100%;background:#120A22;color:#E8EDFA;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  a#ac{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
  img{width:132px;height:132px;border-radius:30px;display:block;margin:0 auto 22px}
  h1{font-size:21px;font-weight:600;margin:0 0 8px}
  p{margin:0 auto;color:#B9A8D6;font-size:16px;line-height:1.5;max-width:30ch}
  .ekle{margin-top:18px;font-size:13px;color:#8E9AC0}
</style>
</head>
<body>
<a id="ac" href="https://claude.ai/artifact/9CKMNoWXqWqZT7bgAf4RNR">
  <div>
    <img src="/kule/foy-kule-ikon-c.png" alt="FÖY Kule" />
    <h1>FÖY Kontrol Kulesi</h1>
    <p>Kuleye girmek için ekrana dokun</p>
    <p class="ekle" id="ekle" hidden>Ana ekrana eklemek için: Paylaş → Ana Ekrana Ekle → Ekle</p>
  </div>
</a>
<script>
// Ana ekrandan "web uygulaması" olarak açıldıysa bağlantıyı sisteme devret: iPhone kuleyi Claude uygulamasında açar.
// (Web uygulamasının kendi penceresinde açılırsa claude.ai çerçevesiyle açılıyordu.)
if (window.navigator.standalone || matchMedia("(display-mode: standalone)").matches) {
  var a = document.getElementById("ac"); a.target = "_blank"; a.rel = "noopener";
}
if (new URLSearchParams(location.search).has("ekle")) {
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  document.getElementById("ekle").hidden = false;
}
</script>
</body>
</html>
